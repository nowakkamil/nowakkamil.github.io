<style type="text/css">
    .kn-email-signature,
    .kn-email-signature table,
    .kn-email-signature td,
    .kn-email-signature a {
        font-family: 'Avenir Next', Avenir, 'Segoe UI', Helvetica, sans-serif !important;
    }

    @media only screen and (max-width: 600px) {
        .kn-email-signature-frame {
            padding: 26px 24px 128px !important;
            background-size: 100% auto !important;
        }

        .kn-email-signature-monogram-cell,
        .kn-email-signature-content-cell {
            display: block !important;
            width: 100% !important;
        }

        .kn-email-signature-monogram-cell {
            padding: 0 0 18px !important;
            text-align: center !important;
        }

        .kn-email-signature-monogram {
            width: 104px !important;
            height: 104px !important;
            margin: 0 auto !important;
        }

        .kn-email-signature-content-cell {
            padding-left: 0 !important;
        }

        .kn-email-signature-identity {
            text-align: center !important;
        }

        .kn-email-signature-tagline {
            padding-right: 0 !important;
        }

        .kn-email-signature-contact-row td {
            font-size: 13px !important;
        }
    }
</style>
<table

    role="presentation"
    cellpadding="0"
    cellspacing="0"
    border="0"

                            <tr>

                            <tr>

                                        color: #eef5fd;
                                        font-size: 14px;
                                        line-height: 25px;

                            </tr>
                            <tr class="kn-email-signature-contact-row">
                                <td width="25" style="width: 25px; padding: 7px 14px 7px 0">
                                    <img
                                        src="{{assetLinkedIn}}"
                                        width="25"
                                        height="25"

                                        style="display: block; width: 25px; height: 25px; border: 0"
                                    />
                                </td>
                                <td
                                    style="

                                        color: #eef5fd;
                                        font-size: 14px;
                                        line-height: 25px;
                                    "
                                >
                                    <a
                                        href="https://www.linkedin.com/in/nowakkamil"
                                        target="_blank"

                                </td>
                            </tr>
                            <tr class="kn-email-signature-contact-row">
                                <td width="25" style="width: 25px; padding: 7px 14px 7px 0">
                                    <img
                                        src="{{assetLocation}}"
                                        width="25"
                                        height="25"
                                        alt="Location"
                                        style="display: block; width: 25px; height: 25px; border: 0"
                                    />
                                </td>
                                <td
                                    style="
                                        padding: 6px 0;
                                        color: #eef5fd;
                                        font-size: 14px;
                                        line-height: 25px;
                                    "
