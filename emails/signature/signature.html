<style type="text/css">
    .kn-signature-shell,
    .kn-signature-shell table,
    .kn-signature-shell td,
    .kn-signature-shell a {
        font-family: 'Avenir Next', Avenir, 'Segoe UI', Helvetica, sans-serif !important;
    }

    @media only screen and (max-width: 788px) {
        .kn-signature-frame {
            padding-left: 108px !important;
            padding-right: 108px !important;
            padding-bottom: 20% !important;
        }

        .kn-signature-column {
            max-width: 100% !important;
        }

        .kn-signature-monogram-column {
            padding: 0 0 22px !important;
        }

        .kn-signature-monogram-cell {
            padding: 0 !important;
            text-align: center !important;
        }

        .kn-signature-monogram-image {
            margin: 0 auto !important;
        }

        .kn-signature-identity {
            text-align: center !important;
        }
    }

    @media only screen and (max-width: 600px) {
        .kn-signature-frame {
            padding-top: 26px !important;
            padding-left: 92px !important;
            padding-right: 92px !important;
            padding-bottom: 20% !important;
        }

        .kn-signature-monogram-column {
            padding: 0 0 18px !important;
        }

        .kn-signature-monogram-image {
            width: 104px !important;
            height: 104px !important;
        }

        .kn-signature-tagline {
            padding-right: 0 !important;
        }

        .kn-signature-contact-row td {
            font-size: 13px !important;
        }
    }
</style>
<table
    class="kn-signature-shell"
    role="presentation"
    cellpadding="0"
    cellspacing="0"
    border="0"
    width="100%"
    bgcolor="#00040e"
    style="
        width: 100%;
        max-width: 760px;
        border: 0;
        border-radius: 12px;
        border-collapse: separate;
        border-spacing: 0;
        background-color: #00040e;
        overflow: hidden;
        font-family: 'Avenir Next', Avenir, 'Segoe UI', Helvetica, sans-serif;
    "
>
    <tr>
        <td
            class="kn-signature-frame"
            background="{{assetWave}}"
            style="
                padding: 29px 44px 49px;
                background-color: #00040e;
                background-image: url('{{assetWave}}');
                background-repeat: no-repeat;
                background-position: left bottom;
                background-size: 100% auto;
            "
        >
            <div class="kn-signature-columns" style="font-size: 0; line-height: 0">
                <!--[if mso]><table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse"><tr><td width="230" valign="top" style="width:230px;padding:0"><![endif]-->
                <div
                    class="kn-signature-column kn-signature-monogram-column"
                    style="
                        display: inline-block;
                        width: 100%;
                        max-width: 230px;
                        vertical-align: top;
                        font-size: 14px;
                        line-height: 22px;
                    "
                >
                    <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        width="100%"
                        style="width: 100%; border-collapse: collapse"
                    >
                        <tr>
                            <td class="kn-signature-monogram-cell" style="padding: 0 0 0 44px">
                                <img
                                    class="kn-signature-monogram-image"
                                    src="{{assetMonogram}}"
                                    width="128"
                                    height="128"
                                    alt="Kamil Nowak initials"
                                    style="
                                        display: block;
                                        width: 128px;
                                        height: 128px;
                                        margin: 0 auto;
                                        border: 0;
                                    "
                                />
                            </td>
                        </tr>
                    </table>
                </div>
                <!--[if mso]></td><td valign="top" style="padding:0"><![endif]-->
                <div
                    class="kn-signature-column kn-signature-content-column"
                    style="
                        display: inline-block;
                        width: 100%;
                        max-width: 330px;
                        vertical-align: top;
                        font-size: 14px;
                        line-height: 22px;
                    "
                >
                    <table
                        class="kn-signature-identity"
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        width="100%"
                        style="width: 100%; border-collapse: collapse; table-layout: fixed"
                    >
                        <tr>
                            <td
                                style="
                                    padding: 0;
                                    color: #f6f8fb;
                                    font-size: 32px;
                                    font-weight: 600;
                                    letter-spacing: -0.5px;
                                    line-height: 39px;
                                "
                            >
                                Kamil Nowak
                            </td>
                        </tr>
                        <tr>
                            <td
                                style="
                                    padding: 4px 0 0;
                                    color: #53a4ff;
                                    font-size: 13px;
                                    font-weight: 500;
                                    letter-spacing: 1.9px;
                                    line-height: 20px;
                                    text-transform: uppercase;
                                "
                            >
                                Senior Full-stack Developer
                            </td>
                        </tr>
                        <tr>
                            <td
                                class="kn-signature-tagline"
                                style="
                                    padding: 6px 20px 6px 0;
                                    color: #d7e0eb;
                                    font-size: 14px;
                                    font-weight: 400;
                                    line-height: 22px;
                                "
                            >
                                Building digital experiences that are fast, reliable and
                                thoughtfully crafted.
                            </td>
                        </tr>
                    </table>
                    <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        width="100%"
                        style="width: 100%; border-collapse: collapse; table-layout: fixed"
                    >
                        <tr class="kn-signature-contact-row">
                            <td width="25" style="width: 25px; padding: 7px 14px 7px 0">
                                <img
                                    src="{{assetGlobe}}"
                                    width="25"
                                    height="25"
                                    alt="Website"
                                    style="display: block; width: 25px; height: 25px; border: 0"
                                />
                            </td>
                            <td
                                style="
                                    padding: 6px 0;
                                    color: #eef5fd;
                                    font-size: 14px;
                                    line-height: 25px;
                                    word-break: break-word;
                                "
                            >
                                <a
                                    href="https://nowakkamil.com"
                                    target="_blank"
                                    style="color: #eef5fd; text-decoration: none"
                                    >nowakkamil.com</a
                                >
                            </td>
                        </tr>
                        <tr class="kn-signature-contact-row">
                            <td width="25" style="width: 25px; padding: 7px 14px 7px 0">
                                <img
                                    src="{{assetEmail}}"
                                    width="25"
                                    height="25"
                                    alt="Email"
                                    style="display: block; width: 25px; height: 25px; border: 0"
                                />
                            </td>
                            <td
                                style="
                                    padding: 6px 0;
                                    color: #eef5fd;
                                    font-size: 14px;
                                    line-height: 25px;
                                    word-break: break-word;
                                "
                            >
                                <a
                                    href="mailto:hello@nowakkamil.com"
                                    style="color: #eef5fd; text-decoration: none"
                                    >hello@nowakkamil.com</a
                                >
                            </td>
                        </tr>
                        <tr class="kn-signature-contact-row">
                            <td width="25" style="width: 25px; padding: 7px 14px 7px 0">
                                <img
                                    src="{{assetLinkedIn}}"
                                    width="25"
                                    height="25"
                                    alt="LinkedIn"
                                    style="display: block; width: 25px; height: 25px; border: 0"
                                />
                            </td>
                            <td
                                style="
                                    padding: 6px 0;
                                    color: #eef5fd;
                                    font-size: 14px;
                                    line-height: 25px;
                                    word-break: break-word;
                                "
                            >
                                <a
                                    href="https://www.linkedin.com/in/nowakkamil"
                                    target="_blank"
                                    style="color: #eef5fd; text-decoration: none"
                                    >linkedin.com/in/nowakkamil</a
                                >
                            </td>
                        </tr>
                        <tr class="kn-signature-contact-row">
                            <td width="25" style="width: 25px; padding: 7px 14px 7px 0">
                                <img
                                    src="{{assetLocation}}"
                                    width="25"
                                    height="25"
                                    alt="Location"
                                    style="display: block; width: 25px; height: 25px; border: 0"
                                />
                            </td>
                            <td
                                style="
                                    padding: 6px 0;
                                    color: #eef5fd;
                                    font-size: 14px;
                                    line-height: 25px;
                                    word-break: break-word;
                                "
                            >
                                Based in Poland, working globally
                            </td>
                        </tr>
                    </table>
                </div>
                <!--[if mso]></td></tr></table><![endif]-->
            </div>
        </td>
    </tr>
</table>
