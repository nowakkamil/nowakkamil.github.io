<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Kamil Nowak — Email signature preview</title>
    </head>
    <body style="margin: 0; padding: 16px; background-color: #010611">
        <style type="text/css">
            .kn-signature-shell,
            .kn-signature-shell table,
            .kn-signature-shell td,
            .kn-signature-shell a {
                font-family: 'Avenir Next', Avenir, 'Segoe UI', Helvetica, sans-serif !important;
            }

            @media only screen and (max-width: 600px) {
                .kn-signature-frame {
                    padding: 26px 24px 128px !important;
                    background-size: 100% auto !important;
                }

                .kn-signature-monogram-cell,
                .kn-signature-content-cell {
                    display: block !important;
                    width: 100% !important;
                }

                .kn-signature-monogram-cell {
                    padding: 0 0 18px !important;
                    text-align: center !important;
                }

                .kn-signature-monogram-image {
                    width: 104px !important;
                    height: 104px !important;
                    margin: 0 auto !important;
                }

                .kn-signature-content-cell {
                    padding-left: 0 !important;
                }

                .kn-signature-identity {
                    text-align: center !important;
                }

                .kn-signature-tagline {
                    padding-right: 0 !important;
                }

                .kn-signature-contact-row td {
                    font-size: 13px !important;
                }
            }
        </style>
        <table
            class="kn-signature-shell"
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="100%"
            bgcolor="#01060f"
            style="
                width: 100%;
                max-width: 760px;
                border: 1px solid #1c2331;
                border-radius: 12px;
                border-collapse: separate;
                border-spacing: 0;
                background-color: #01060f;
                overflow: hidden;
                font-family: 'Avenir Next', Avenir, 'Segoe UI', Helvetica, sans-serif;
            "
        >
            <tr>
                <td
                    class="kn-signature-frame"
                    style="
                        padding: 29px 44px 49px;
                        background-color: #01060f;
                        background-image: url('https://nowakkamil.com/email/signature-wave.png');
                        background-repeat: no-repeat;
                        background-position: left bottom;
                        background-size: 100% auto;
                    "
                >
                    <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        width="100%"
                        style="width: 100%; border-collapse: collapse; table-layout: fixed"
                    >
                        <tr>
                            <td
                                class="kn-signature-monogram-cell"
                                width="144"
                                valign="top"
                                style="width: 144px; padding: 24px 16px 0 20px"
                            >
                                <img
                                    class="kn-signature-monogram-image"
                                    src="https://nowakkamil.com/email/kn-monogram.png"
                                    width="128"
                                    height="128"
                                    alt="Kamil Nowak initials"
                                    style="
                                        display: block;
                                        width: 128px;
                                        height: 128px;
                                        margin: 0 auto;
                                        border: 0;
                                    "
                                />
                            </td>
                            <td class="kn-signature-content-cell" valign="top" style="padding: 0 0 0 20px">
                                <table
                                    class="kn-signature-identity"
                                    role="presentation"
                                    cellpadding="0"
                                    cellspacing="0"
                                    border="0"
                                    width="100%"
                                    style="width: 100%; border-collapse: collapse; table-layout: fixed"
                                >
                                    <tr>
                                        <td
                                            style="
                                                padding: 0;
                                                color: #f6f8fb;
                                                font-size: 32px;
                                                font-weight: 700;
                                                letter-spacing: -0.5px;
                                                line-height: 39px;
                                            "
                                        >
                                            Kamil Nowak
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                            style="
                                                padding: 3px 0 0;
                                                color: #53a4ff;
                                                font-size: 13px;
                                                font-weight: 500;
                                                letter-spacing: 1.9px;
                                                line-height: 20px;
                                                text-transform: uppercase;
                                            "
                                        >
                                            Senior Full-stack Developer
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                            class="kn-signature-tagline"
                                            style="
                                                padding: 10px 70px 10px 0;
                                                color: #d7e0eb;
                                                font-size: 14px;
                                                font-weight: 400;
                                                line-height: 22px;
                                            "
                                        >
                                            Building digital experiences that are fast, reliable and
                                            thoughtfully crafted.
                                        </td>
                                    </tr>
                                </table>
                                <table
                                    role="presentation"
                                    cellpadding="0"
                                    cellspacing="0"
                                    border="0"
                                    width="100%"
                                    style="width: 100%; border-collapse: collapse; table-layout: fixed"
                                >
                                    <tr class="kn-signature-contact-row">
                                        <td width="25" style="width: 25px; padding: 7px 14px 7px 0">
                                            <img
                                                src="https://nowakkamil.com/email/globe.png"
                                                width="25"
                                                height="25"
                                                alt="Website"
                                                style="display: block; width: 25px; height: 25px; border: 0"
                                            />
                                        </td>
                                        <td
                                            style="
                                                padding: 7px 0;
                                                color: #eef5fd;
                                                font-size: 14px;
                                                line-height: 25px;
                                            "
                                        >
                                            <a
                                                href="https://nowakkamil.com"
                                                target="_blank"
                                                style="color: #eef5fd; text-decoration: none"
                                                >nowakkamil.com</a
                                            >
                                        </td>
                                    </tr>
                                    <tr class="kn-signature-contact-row">
                                        <td width="25" style="width: 25px; padding: 7px 14px 7px 0">
                                            <img
                                                src="https://nowakkamil.com/email/email.png"
                                                width="25"
                                                height="25"
                                                alt="Email"
                                                style="display: block; width: 25px; height: 25px; border: 0"
                                            />
                                        </td>
                                        <td
                                            style="
                                                padding: 7px 0;
                                                color: #eef5fd;
                                                font-size: 14px;
                                                line-height: 25px;
                                            "
                                        >
                                            <a
                                                href="mailto:hello@nowakkamil.com"
                                                style="color: #eef5fd; text-decoration: none"
                                                >hello@nowakkamil.com</a
                                            >
                                        </td>
                                    </tr>
                                    <tr class="kn-signature-contact-row">
                                        <td width="25" style="width: 25px; padding: 7px 14px 7px 0">
                                            <img
                                                src="https://nowakkamil.com/email/linkedin.png"
                                                width="25"
                                                height="25"
                                                alt="LinkedIn"
                                                style="display: block; width: 25px; height: 25px; border: 0"
                                            />
                                        </td>
                                        <td
                                            style="
                                                padding: 7px 0;
                                                color: #eef5fd;
                                                font-size: 14px;
                                                line-height: 25px;
                                            "
                                        >
                                            <a
                                                href="https://www.linkedin.com/in/nowakkamil"
                                                target="_blank"
                                                style="color: #eef5fd; text-decoration: none"
                                                >linkedin.com/in/nowakkamil</a
                                            >
                                        </td>
                                    </tr>
                                    <tr class="kn-signature-contact-row">
                                        <td width="25" style="width: 25px; padding: 7px 14px 7px 0">
                                            <img
                                                src="https://nowakkamil.com/email/location.png"
                                                width="25"
                                                height="25"
                                                alt="Location"
                                                style="display: block; width: 25px; height: 25px; border: 0"
                                            />
                                        </td>
                                        <td
                                            style="
                                                padding: 7px 0;
                                                color: #eef5fd;
                                                font-size: 14px;
                                                line-height: 25px;
                                            "
                                        >
                                            Based in Poland, working globally
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            <!--[if mso]>
                <tr>
                    <td style="padding: 0">
                        <img
                            src="https://nowakkamil.com/email/signature-wave.png"
                            width="760"
                            height="398"
                            alt=""
                            style="display: block; width: 100%; max-width: 680px; height: auto; border: 0"
                        />
                    </td>
                </tr>
            <![endif]-->
        </table>
    </body>
</html>
