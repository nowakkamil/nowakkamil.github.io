<!doctype html>
<html lang="en">
    <head>

        <title>Kamil Nowak — Email signature preview</title>
    </head>
    <body style="margin: 0; padding: 16px; background-color: #010611">
        <style type="text/css">
            .kn-signature-shell,
            .kn-signature-shell table,
            .kn-signature-shell td,
            .kn-signature-shell a {
                font-family: 'Avenir Next', Avenir, 'Segoe UI', Helvetica, sans-serif !important;
            }

            @media only screen and (max-width: 600px) {
                .kn-signature-frame {
                    padding: 26px 22px 8px !important;
                }

                .kn-signature-monogram-cell,
                .kn-signature-content-cell {
                    display: block !important;
                    width: 100% !important;
                }

                .kn-signature-monogram-cell {
                    padding: 0 0 18px !important;
                    text-align: center !important;
                }

                .kn-signature-monogram-image {
                    width: 92px !important;
                    height: 92px !important;
                    margin: 0 auto !important;
                }

                .kn-signature-content-cell {
                    padding-left: 0 !important;
                }

                .kn-signature-identity {
                    text-align: center !important;
                }
            }
        </style>

            class="kn-signature-shell"
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="100%"
            bgcolor="#030a18"
            style="
                width: 100%;
                max-width: 760px;
                border: 1px solid #192b42;
                border-radius: 7px;
                border-collapse: separate;
                border-spacing: 0;

                                        height: 118px;

                                        border: 0;

                            <td

                                                color: #f6f8fb;
                                                font-size: 28px;
                                                font-weight: 600;

                                                line-height: 34px;
                                            "
                                        >
                                            Kamil Nowak
                                        </td>
                                    </tr>
                                    <tr>

                                                color: #53a4ff;
                                                font-size: 13px;
                                                font-weight: 500;

                                                line-height: 20px;

                                                color: #d7e0eb;

                                                line-height: 21px;

                                        <td
