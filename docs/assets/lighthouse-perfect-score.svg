<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title description">
  <title id="title">Perfect Lighthouse scores</title>
  <desc id="description">Performance, Accessibility, Best Practices and SEO each score 100. Agentic Browsing scores 3 out of 3.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191f" />
      <stop offset="1" stop-color="#090d12" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="250" rx="16" fill="url(#background)" />
  <rect x="0.5" y="0.5" width="1199" height="249" rx="15.5" fill="none" stroke="#27313d" />

  <g fill="#f2f5f8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g transform="translate(205 92)">
      <circle r="50" fill="#071b13" stroke="#0cce6b" stroke-width="7" />
      <text y="12" fill="#0cce6b" font-size="36" font-weight="500" font-variant-numeric="tabular-nums">100</text>
      <text y="92" font-size="18" font-weight="650">Performance</text>
    </g>

    <g transform="translate(405 92)">
      <circle r="50" fill="#071b13" stroke="#0cce6b" stroke-width="7" />
      <text y="12" fill="#0cce6b" font-size="36" font-weight="500" font-variant-numeric="tabular-nums">100</text>
      <text y="92" font-size="18" font-weight="650">Accessibility</text>
    </g>

    <g transform="translate(605 92)">
      <circle r="50" fill="#071b13" stroke="#0cce6b" stroke-width="7" />
      <text y="12" fill="#0cce6b" font-size="36" font-weight="500" font-variant-numeric="tabular-nums">100</text>
      <text y="88" font-size="18" font-weight="650">Best</text>
      <text y="112" font-size="18" font-weight="650">Practices</text>
    </g>

    <g transform="translate(805 92)">
      <circle r="50" fill="#071b13" stroke="#0cce6b" stroke-width="7" />
      <text y="12" fill="#0cce6b" font-size="36" font-weight="500" font-variant-numeric="tabular-nums">100</text>
      <text y="92" font-size="18" font-weight="650">SEO</text>
    </g>

    <g transform="translate(1010 92)">
      <rect x="-78" y="-30" width="156" height="60" rx="30" fill="#0b2b1d" stroke="#155b3a" />
      <circle cx="-43" r="11" fill="#0cce6b" filter="url(#glow)" />
      <text x="22" y="11" fill="#0cce6b" font-size="31" font-weight="500" font-variant-numeric="tabular-nums">3/3</text>
      <text y="88" font-size="18" font-weight="650">Agentic</text>
      <text y="112" font-size="18" font-weight="650">Browsing</text>
    </g>
  </g>

  <g opacity="0.88">
    <circle cx="63" cy="25" r="4" fill="#80cbc4" />
    <circle cx="89" cy="42" r="3.5" fill="#ce93d8" />
    <circle cx="112" cy="18" r="3" fill="#ffab91" />
    <circle cx="137" cy="48" r="4" fill="#9fa8da" />
    <rect x="155" y="22" width="7" height="7" rx="2" fill="#aed581" transform="rotate(24 158.5 25.5)" />
    <circle cx="172" cy="57" r="3" fill="#f3c77b" />
    <circle cx="339" cy="24" r="3.5" fill="#80cbc4" />
    <circle cx="367" cy="54" r="3" fill="#f48fb1" />
    <rect x="437" y="20" width="7" height="7" rx="2" fill="#9fa8da" transform="rotate(34 440.5 23.5)" />
    <circle cx="461" cy="44" r="3.5" fill="#aed581" />
    <circle cx="548" cy="25" r="3" fill="#ffab91" />
    <circle cx="660" cy="45" r="3.5" fill="#ce93d8" />
    <circle cx="745" cy="22" r="3" fill="#80cbc4" />
    <rect x="853" y="37" width="7" height="7" rx="2" fill="#f3c77b" transform="rotate(28 856.5 40.5)" />
    <circle cx="1117" cy="23" r="4" fill="#aed581" />
    <circle cx="1144" cy="49" r="3.5" fill="#80cbc4" />
    <circle cx="1169" cy="19" r="3" fill="#f48fb1" />
    <rect x="1088" y="56" width="7" height="7" rx="2" fill="#9fa8da" transform="rotate(31 1091.5 59.5)" />
  </g>
</svg>
