<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, follow" />
        <meta name="theme-color" content="#03070d" />
        <title>Page not found | Kamil Nowak</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: system-ui, sans-serif;
                background: #03070d;
                color: #edf8ff;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                background: radial-gradient(circle at 50% 0%, #123247, transparent 38rem), #03070d;
            }

            main {
                width: min(38rem, calc(100% - 2rem));
            }

            p:first-child {
                color: #9eefff;
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.14em;
                text-transform: uppercase;
            }

            h1 {
                margin: 0.75rem 0 1rem;
                font-size: clamp(3rem, 10vw, 6rem);
                letter-spacing: -0.06em;
                line-height: 0.95;
            }

            p {
                color: #afc0cb;
                font-size: 1.1rem;
                line-height: 1.65;
            }

            nav {
                margin-top: 2rem;
            }

            a {
                display: inline-block;
                padding: 0.7rem 1rem;
                border: 1px solid rgb(158 239 255 / 28%);
                border-radius: 999px;
                color: #edf8ff;
                text-decoration: none;
            }

            a:hover,
            a:focus-visible {
                border-color: #9eefff;
                color: #9eefff;
            }
        </style>
    </head>
    <body>
        <main>
            <p>Error 404</p>
            <h1>This page drifted out of orbit.</h1>
            <p>The address does not match a published page.</p>

            <nav aria-label="Recovery">
                <a href="/">Main page</a>
            </nav>
        </main>
    </body>
</html>
